<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Sightline: see the view from your exact seat before you book. Movies, concerts and football in real-time 3D.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sightline · Stadium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#f2652a; --orange-2:#ff8a4c; --ink:#15151a; --muted:#8e8e99; --line:#ececf1;
  --card:rgba(255,255,255,.94); --dark:#1b1b1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0c0c0f;color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
body.pointer #c{cursor:pointer}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(120% 90% at 50% 40%,#1d1d22 0%,#0b0b0d 70%);color:#fff;transition:opacity 1s ease .2s,visibility 0s 1.3s}
#loader.gone{opacity:0;visibility:hidden}
#loader .mark{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:var(--orange);animation:spin 1s linear infinite}
#loader .ttl{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
#loader .step{font-size:15px;font-weight:500;min-height:20px}
#loader .bar{width:220px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange-2));transition:width .35s ease}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- tooltip card ---------- */
.card{display:flex;align-items:stretch;background:var(--card);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border-radius:12px;box-shadow:0 14px 34px -10px rgba(0,0,0,.42),0 2px 6px rgba(0,0,0,.08);padding:9px 0;white-space:nowrap}
.tip{position:fixed;left:0;top:0;z-index:20;pointer-events:none;opacity:0;
  transform:translate(-50%,-100%) translateY(8px) scale(.94);transform-origin:50% 100%;
  transition:opacity .22s ease,transform .32s cubic-bezier(.2,.9,.25,1)}
.tip.below{transform:translate(-50%,0) translateY(-8px) scale(.94);transform-origin:50% 0}
.tip.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
.tip.below.show{transform:translate(-50%,0) scale(1)}
.tip.bump{animation:bump .42s ease}
@keyframes bump{20%{margin-left:-7px}40%{margin-left:6px}60%{margin-left:-4px}80%{margin-left:2px}}
.thumb{width:58px;height:38px;border-radius:7px;object-fit:cover;filter:contrast(1.07) saturate(1.08) sepia(.05);margin-left:10px;align-self:center;display:none;background:#ddd}
.card.has-thumb .thumb{display:block}
.c-main{padding:0 16px 0 14px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.lbl{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.c-title{font-size:16px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.c-status{font-size:10.5px;color:#73737e;display:flex;align-items:center;gap:5px;line-height:1.3}
.c-status i{width:6px;height:6px;border-radius:50%;background:#20b46d;flex:none}
.c-status.off i{background:#b5b5be}
.c-status:empty{display:none}
.c-price{border-left:1px solid var(--line);padding:0 15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.c-amt{font-size:16px;font-weight:600;color:#ef5a2a;letter-spacing:-.01em}
.c-amt.dim{color:#b0b0b9}

/* ---------- ticket ---------- */
#ticketWrap{position:fixed;left:50%;top:50%;z-index:30;transform:translate(-50%,-50%);perspective:1600px;pointer-events:none;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.45)) drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.ticket{display:flex;width:min(690px,92vw);height:236px;background:#fff;border-radius:16px;overflow:hidden;pointer-events:none;
  opacity:0;transform:translateY(26px) scale(.93) rotateX(8deg);filter:blur(8px);
  transition:opacity .5s ease,transform .7s cubic-bezier(.2,.9,.2,1),filter .5s ease;
  -webkit-mask:radial-gradient(circle 11px at calc(100% - 124px) 0,#0000 98%,#000) top/100% 51% no-repeat,
               radial-gradient(circle 11px at calc(100% - 124px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle 11px at calc(100% - 124px) 0,#0000 98%,#000) top/100% 51% no-repeat,
               radial-gradient(circle 11px at calc(100% - 124px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.ticket.show{opacity:1;transform:none;filter:none;pointer-events:auto}
.t-img{position:relative;width:37%;flex:none;overflow:hidden;background:#d9d4cc}
.t-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.07) saturate(1.08) sepia(.05);transform:scale(1.06);transition:transform 6s ease}
.ticket.show .t-img img{transform:scale(1)}
.pill{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;
  background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:11px;font-weight:600;color:#3a3a42}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(242,101,42,.22);animation:pulse 1.8s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(242,101,42,.05)}}
.t-body{flex:1;min-width:0;padding:20px 22px 16px;display:flex;flex-direction:column}
.t-title{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:3px}
.t-grid{display:flex;gap:24px;margin-top:14px}
.t-grid div{display:flex;flex-direction:column;gap:2px}
.t-grid b{font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1}
.t-actions{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.btn-orange{background:linear-gradient(180deg,#f8803f,#ec5720);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:13px;
  box-shadow:0 8px 18px -8px rgba(236,87,32,.9),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;transition:transform .15s ease,box-shadow .2s ease}
.btn-orange:hover{transform:translateY(-1px);box-shadow:0 12px 22px -8px rgba(236,87,32,.95),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-white{background:#fff;color:#2d2d34;border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:13px;cursor:pointer;
  box-shadow:0 8px 18px -10px rgba(0,0,0,.5);transition:transform .15s ease}
.btn-white:hover{transform:translateY(-1px)}
.t-link{background:none;border:0;color:#8a8a94;font-size:12px;cursor:pointer;padding:2px 2px}
.t-link:hover{color:#333}
.t-stub{width:124px;flex:none;border-left:2px dashed #e2e2ea;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 0 18px}
.barcode{width:40px;height:92px;background-size:100% 100%}
.t-price{font-size:23px;font-weight:600;color:#ef5a2a;letter-spacing:-.02em}
.ticket.vip{background:var(--dark);color:#fff}
.ticket.vip .lbl{color:#9b9ba6}
.ticket.vip .t-stub{border-left-color:#4a4a52}
.ticket.vip .t-price{color:#f0eee9}
.ticket.vip .t-link{color:#9a9aa3}
.ticket.vip .t-link:hover{color:#fff}
.ticket.vip .pill{background:rgba(20,20,24,.7);color:#fff}

/* ---------- POV card ---------- */
#pov{position:fixed;left:50%;top:max(7vh,64px);z-index:25;transform:translate(-50%,-10px) scale(.96);opacity:0;pointer-events:none;
  transition:opacity .4s ease,transform .5s cubic-bezier(.2,.9,.25,1)}
#pov.show{opacity:1;transform:translate(-50%,0)}
#povActions{position:fixed;left:50%;bottom:max(7vh,70px);z-index:25;display:flex;gap:10px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  transition:opacity .4s ease .1s,transform .5s cubic-bezier(.2,.9,.25,1) .1s}
#povActions.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#povActions button{padding:11px 22px;font-size:14px}

/* ---------- HUD ---------- */
#home{display:flex;align-items:center;justify-content:center;width:34px;height:33px;padding:0;color:#2a2a31;text-decoration:none}
#hud{position:fixed;left:18px;top:18px;z-index:26;display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .6s ease}
body.ready #hud{opacity:1}
.chip{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:0;border-radius:999px;padding:8px 14px;
  font-size:12px;font-weight:600;color:#2a2a31;box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
#back{cursor:pointer;display:none;align-items:center;gap:6px}
#back svg{width:12px;height:12px}
body.can-back #back{display:flex}
#crumbs{display:flex;align-items:center;max-width:60vw;overflow:hidden}
#crumbs span{white-space:nowrap}
#crumbs span+span::before{content:"›";margin:0 7px;color:#b0b0ba;font-weight:500}
#crumbs span:last-child{color:var(--orange)}
#hint{position:fixed;left:50%;bottom:26px;z-index:24;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;
  color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.5);transition:opacity .4s ease;pointer-events:none;white-space:nowrap}
#hint:empty{opacity:0}
#tourBtn{position:fixed;right:18px;bottom:20px;z-index:26;cursor:pointer;display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .6s ease}
body.ready #tourBtn{opacity:1}
#tourBtn i{width:0;height:0;border-left:7px solid var(--orange);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
body.touring #tourBtn i{width:8px;height:8px;border:0;background:var(--orange);border-radius:1px}
#brand{position:fixed;right:18px;top:18px;z-index:26;opacity:0;transition:opacity .6s ease;display:flex;align-items:center;gap:8px}
body.ready #brand{opacity:1}
#brand b{width:8px;height:8px;border-radius:50%;background:var(--orange)}

/* ---------- confirmation ---------- */
#done{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(10,10,12,.45);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s .4s}
#done.show{opacity:1;visibility:visible;transition:opacity .4s ease}
.done-card{width:min(400px,90vw);background:#fff;border-radius:20px;padding:30px 28px 24px;text-align:center;
  transform:translateY(20px) scale(.95);transition:transform .6s cubic-bezier(.2,.9,.2,1);box-shadow:0 40px 80px -20px rgba(0,0,0,.6)}
#done.show .done-card{transform:none}
.check{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(180deg,#f8803f,#ec5720);display:grid;place-items:center;
  box-shadow:0 12px 26px -10px rgba(236,87,32,.9)}
.check svg{width:28px;height:28px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:40;stroke-dashoffset:40}
#done.show .check svg{animation:draw .6s ease .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done-card h2{font-size:22px;letter-spacing:-.02em}
.done-card p{font-size:13px;color:#777;margin-top:6px;line-height:1.5}
.done-row{display:flex;justify-content:center;gap:22px;margin:18px 0 20px;padding:14px 0;border-top:1px dashed #e4e4ea;border-bottom:1px dashed #e4e4ea}
.done-row div{display:flex;flex-direction:column;gap:3px}
.done-row b{font-size:18px}
.done-card .btn-orange{width:100%;padding:12px}
.ref{font-size:11px;color:#aaa;margin-top:12px;letter-spacing:.08em}

@media (max-width:680px){
  .ticket{flex-direction:column;height:auto;-webkit-mask:none;mask:none;width:min(380px,92vw)}
  .t-img{width:100%;height:150px}
  .t-body{padding:16px 18px 12px}
  .t-title{font-size:22px}
  .t-grid b{font-size:25px}
  .t-actions{flex-direction:row;align-items:center;gap:12px;margin-top:14px}
  .t-stub{width:100%;flex-direction:row;border-left:0;border-top:2px dashed #e2e2ea;padding:12px 18px}
  .ticket.vip .t-stub{border-top-color:#4a4a52}
  .barcode{width:92px;height:28px;transform:none}
  #crumbs{display:none}
  #hint{bottom:74px;font-size:11px}
  #brand{display:none}
  #povActions{flex-direction:column;width:min(320px,86vw)}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="loader">
  <div class="mark"></div>
  <div class="ttl">Matchday</div>
  <div class="step" id="ldStep">Warming up</div>
  <div class="bar"><i id="ldBar"></i></div>
</div>

<div id="tip" class="tip card">
  <img class="thumb" id="tipThumb" alt="">
  <div class="c-main">
    <div class="lbl" id="tipLbl">From</div>
    <div class="c-title" id="tipTitle">South Stand</div>
    <div class="c-status" id="tipStatus"></div>
  </div>
  <div class="c-price"><div class="lbl">INR</div><div class="c-amt" id="tipAmt">1,250</div></div>
</div>

<div id="ticketWrap">
  <div id="ticket" class="ticket">
    <div class="t-img"><img id="tImg" alt="Your view"><span class="pill"><i></i><span id="tPill">Your view</span></span></div>
    <div class="t-body">
      <div class="lbl" id="tLbl">North Stand · Middle tier</div>
      <div class="t-title" id="tTitle">Block 232</div>
      <div class="t-grid" id="tGrid"></div>
      <div class="t-actions">
        <button class="btn-orange" id="tPrimary">Upgrade</button>
        <button class="t-link" id="tSecondary">Keep my seat</button>
      </div>
    </div>
    <div class="t-stub"><div class="lbl">INR</div><div class="barcode" id="tBar"></div><div class="t-price" id="tPrice">1,250</div></div>
  </div>
</div>

<div id="pov" class="card">
  <div class="c-main">
    <div class="lbl" id="povLbl">From</div>
    <div class="c-title" id="povTitle">Your view</div>
    <div class="c-status" id="povStatus"></div>
  </div>
  <div class="c-price"><div class="lbl">INR</div><div class="c-amt" id="povAmt">1,250</div></div>
</div>
<div id="povActions">
  <button class="btn-orange" id="confirmBtn">Confirm ticket</button>
  <button class="btn-white" id="anotherBtn">Choose another seat</button>
</div>

<div id="hud">
  <a class="chip" id="home" href="index.html" title="Home" aria-label="Home"><svg viewBox="0 0 16 16" width="13" height="13"><path d="M2.5 7.2 8 2.8l5.5 4.4V13a.8.8 0 0 1-.8.8H9.6V10H6.4v3.8H3.3a.8.8 0 0 1-.8-.8z" fill="currentColor"/></svg></a>
  <button class="chip" id="back"><svg viewBox="0 0 12 12"><path d="M7.5 2 3.5 6l4 4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
  <div class="chip" id="crumbs"><span>Stadium</span></div>
</div>
<div class="chip" id="brand"><b></b><span id="brandTxt">Matchday · Final</span></div>
<div id="hint"></div>
<button class="chip" id="tourBtn"><i></i><span id="tourLbl">Auto tour</span></button>

<div id="done">
  <div class="done-card">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>You're in.</h2>
    <p id="doneText">Your ticket is confirmed.</p>
    <div class="done-row" id="doneRow"></div>
    <button class="btn-orange" id="doneBtn">Book another seat</button>
    <div class="ref" id="doneRef">REF</div>
  </div>
</div>

<script type="importmap">

import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = s => document.getElementById(s);
const V3 = THREE.Vector3;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

const fmt = n => n.toLocaleString('en-IN');
const EVENT = /[?&]event=concert\b/.test(location.search) ? 'concert' : 'football';
const inr = n => '₹' + n.toLocaleString('en-IN');
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

}
const col = hex => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };

/* =====================================================================
   Renderer / scene
   ===================================================================== */
const canvas = $('c');
const HQ = /[?&]hq\b/.test(location.search);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // re-rendered only when the sun's view actually changes
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
scene.fog = new THREE.Fog(0xd8e2e8, 800, 2600);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.15, 6000);

let SUN = new V3(-0.62, 0.62, 0.48).normalize();
const sun = new THREE.DirectionalLight(0xfff0dc, 2.7);
sun.position.copy(SUN).multiplyScalar(500);

/* ---------- post-processing: GTAO ambient occlusion, bloom, filmic grade ---------- */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 }));
const renderPass = new RenderPass(scene, camera);
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({ radius: 0.2, distanceExponent: 1.6, thickness: 1.6, scale: 1.25, samples: 16, screenSpaceRadius: true, distanceFallOff: 1 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 10 });
gtao.blendIntensity = 0.7;
{ /* AO at half resolution, and ignore glass / overlays when building the AO buffer */
  const setSize = gtao.setSize.bind(gtao); gtao.setSize = (w, h) => setSize(Math.max(1, w * .5 | 0), Math.max(1, h * .5 | 0));
  gtao.overrideVisibility = function () { const c = this._visibilityCache; this.scene.traverse(o => { c.set(o, o.visible); if (o.isPoints || o.isLine || o.userData.noAO || (o.isMesh && o.material && o.material.transparent)) o.visible = false; }); };

/* =====================================================================
   Seat ripple — the seats go grey one by one around your pick
   ===================================================================== */
let ripple = null;

  const list = [];
  for (let i = 0; i < NS; i++) { const dx = seatPos[i * 3] - cx, dy = seatPos[i * 3 + 1] - cy, dz = seatPos[i * 3 + 2] - cz, d = dx * dx + dy * dy + dz * dz; if (d < 3600) list.push([d, i]); }

}

function updateRipple(now) {
  if (!ripple) return;
  const r = (now - ripple.t0) / 1000 * (ripple.out ? 70 : 9) + (ripple.out ? 0 : .3);
  let changed = false;
  while (ripple.ptr < ripple.idx.length && ripple.d[ripple.ptr] < r) {
    const i = ripple.idx[ripple.ptr++]; greyed[i] = ripple.out ? 0 : 1; writeColor(i); changed = true;
  }
  if (changed) seatsMesh.instanceColor.needsUpdate = true;
  if (ripple.out && ripple.ptr >= ripple.idx.length) ripple = null;
}

/* =====================================================================
   Block animation (orange highlight, sold-out grey, taken seats)
   ===================================================================== */
function updateBlocks(dt) {
  const k = 1 - Math.exp(-dt * 9);
  for (const B of blocks) {
    let ch = false;
    if (B.hl !== B.hlT) { B.hl = Math.abs(B.hlT - B.hl) < .01 ? B.hlT : lerp(B.hl, B.hlT, k); ch = true; }
    if (B.grey !== B.greyT) { B.grey = Math.abs(B.greyT - B.grey) < .01 ? B.greyT : lerp(B.grey, B.greyT, k); ch = true; }
    if (B.focus !== B.focusT) { B.focus = Math.abs(B.focusT - B.focus) < .01 ? B.focusT : lerp(B.focus, B.focusT, k); ch = true; }
    if (ch) {
      recolorBlock(B);
      B.overlay.visible = B.hl > .01;
      B.overlay.material.color.set(B.soldOut ? '#b9b5c0' : '#ff6a14');
      B.overlay.material.opacity = B.hl * (S.mode === 'overview' ? .55 : .3);

}

  }
}

$('back').onclick = back;
$('confirmBtn').onclick = confirmTicket;
$('anotherBtn').onclick = chooseAnother;
$('doneBtn').onclick = () => { $('done').classList.remove('show'); goOverview(); };
addEventListener('keydown', e => { if (e.key === 'Escape') back(); });

/* =====================================================================
   Auto tour — the same flow as the reel, hands-free
   ===================================================================== */
let tour = null;
function stopTour() { tour = null; document.body.classList.remove('touring'); $('tourLbl').textContent = 'Auto tour'; }
async function runTour() {
  const tok = {}; tour = tok; document.body.classList.add('touring'); $('tourLbl').textContent = 'Stop tour';
  const live = () => tour === tok;
  const wait = async ms => { await sleep(ms); return live(); };
  if (S.busy) await sleep(1200);
  if (S.mode !== 'overview') { await goOverview(); }
  if (!live()) return;
  for (const [si, ms] of [[6, 1000], [4, 900], [7, 900], [3, 900], [0, 1100]]) { setHover({ type: 'stand', id: si }); if (!await wait(ms)) return; }
  await selectStand(0); if (!live()) return;
  const bn = n => blocks.find(B => B.num === n).id;
  for (const [n, ms] of [[331, 900], [234, 900], [232, 1000]]) { setHover({ type: 'block', id: bn(n) }); if (!await wait(ms)) return; }
  const B = blocks[bn(232)];
  await selectBlock(B.id); if (!live()) return;
  const target = findSeat(B, 10, 8);
  let takenNear = -1; for (let i = B.start; i < B.start + B.count; i++) if (seatTaken[i] && seatRow[i] >= 11 && seatRow[i] <= 13) { takenNear = i; break; }
  if (takenNear >= 0) { setHover({ type: 'seat', id: takenNear }); if (!await wait(900)) return; }
  setHover({ type: 'seat', id: target }); if (!await wait(1300)) return;
  await selectSeat(target); if (!await wait(2300)) return;
  upgrade(boxes.find(b => b.num === 12).id); if (!await wait(2300)) return;
  await chooseVip(); if (!live()) return;
  setHover({ type: 'box', id: boxes.find(b => b.num === 11).id }); if (!await wait(1000)) return;
  const bx = boxes[S.box];
  setHover({ type: 'chair', id: bx.chairs[6] }); if (!await wait(900)) return;
  setHover({ type: 'chair', id: bx.chairs[4] }); if (!await wait(900)) return;
  await selectChair(bx.chairs[4]); if (!await wait(3200)) return;
  hidePov(); await goOverview();
  stopTour();
}
$('tourBtn').onclick = () => { if (tour) stopTour(); else if (S.mode !== 'intro') runTour(); };

/* =====================================================================
   Loop + boot
   ===================================================================== */
let last = performance.now(), fpsT = 0, fpsN = 0;
let frameErr = 0, looping = false;
function frame(now) {
  requestAnimationFrame(frame);
  try { tick(now); } catch (e) { if (frameErr++ < 3) console.error('frame error', e); }
}
function tick(now) {
  const raw = (now - last) / 1000, dt = Math.min(.05, raw); last = now;
  updateCamera(dt); updateShadow(); updateBlocks(dt); updateRipple(now);
  if (S.hover) positionTip();
  sky.position.copy(camera.position);
  grade.uniforms.time.value = now / 1000;
  if (stageMat) stageMat.uniforms.t.value = now / 1000;
  composer.render(dt);
  /* adaptive quality */
  if (qPending && !flight) { qPending = false; if (qLevel < QL.length - 1) { qLevel++; applyQuality(); } fpsT = 0; fpsN = 0; }
  if (!HQ && qForce === undefined && S.mode !== 'intro' && !document.hidden && raw < .1) {
    fpsT += raw; fpsN++;
    if (fpsT > 1.5) { if (fpsN / fpsT < (qLevel >= DEFAULT_Q ? 30 : 55) && qLevel < QL.length - 1) qPending = true; fpsT = 0; fpsN = 0; }
  }
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); grade.uniforms.res.value.set(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (!flight && S.mode === 'overview') { const p = poseOverview(); camPose.pos.copy(p.pos); camPose.target.copy(p.target); }
});

/* ---------- start-up that can never hang ---------- */
const gpuName = (() => { try { const gl = renderer.getContext(), e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? String(gl.getParameter(e.UNMASKED_RENDERER_WEBGL)) : ''; } catch (err) { return ''; } })();
const SOFTWARE_GL = /swiftshader|llvmpipe|softpipe|software|basic render/i.test(gpuName);
/* frame-rate probe: finishes after `ms` of wall-clock time even if the browser delivers no frames */
function measureFps(ms) {
  return new Promise(res => {
    let n = 0, done = false; const t0 = performance.now();
    const finish = () => { if (done) return; done = true; res(n / Math.max(.001, (performance.now() - t0) / 1000)); };
    const f = () => { if (done) return; n++; if (performance.now() - t0 < ms) requestAnimationFrame(f); else finish(); };
    requestAnimationFrame(f); setTimeout(finish, ms + 300);
  });
}
/* compile every shader in the background, in batches, so the page never freezes.
   A first visit has no shader cache, and on Macs (ANGLE → Metal) compiling these lit materials can take
   tens of seconds; rendering before they finish would block the main thread, so we wait for them instead. */
async function warmShaders(onProgress) {
  /* one representative mesh per shader variant (material + instancing + geometry layout) */
  const objs = [], seen = new Set();
  scene.traverse(o => {
    if (!((o.isMesh || o.isPoints || o.isLine || o.isSprite) && o.material)) return;
    const g = o.geometry, key = [].concat(o.material).map(m => m.uuid).join() + (o.isInstancedMesh ? 'I' : '') + (o.instanceColor ? 'C' : '') + (o.isSkinnedMesh ? 'S' : '') + (o.isPoints ? 'P' : o.isLine ? 'L' : o.isSprite ? 'Sp' : '') + (g ? Object.keys(g.attributes).sort().join() + Object.keys(g.morphAttributes || {}).join() : '');
    if (!seen.has(key)) { seen.add(key); objs.push(o); }
  });
  const t0 = performance.now(), B = 8;
  try {
    for (let i = 0; i < objs.length; i += B) {
      await Promise.all(objs.slice(i, i + B).map(o => renderer.compileAsync(o, camera, scene)));
      if (onProgress) onProgress(Math.min(1, (i + B) / objs.length));
      if (performance.now() - t0 > 90000) { console.warn('shader warm-up: giving up after 90 s'); break; }
    }
  } catch (e) { console.warn('shader warm-up skipped', e); }
  if (/[?&]debug\b/.test(location.search)) console.log(`[boot] shaders ready in ${Math.round(performance.now() - t0)} ms, ${renderer.info.programs.length} programs`);
}
/* ?cold: salt every shader so the GPU's shader cache misses, to reproduce a first visit */
function saltShaders() {
  const salt = Math.random().toString(36).slice(2);
  scene.traverse(o => { for (const m of o.material ? [].concat(o.material) : []) {
    const prev = m.onBeforeCompile, key = m.customProgramCacheKey.bind(m);
    m.onBeforeCompile = (sh, r) => { prev.call(m, sh, r); sh.fragmentShader = '// ' + salt + '\n' + sh.fragmentShader; };
    m.customProgramCacheKey = () => salt + key();
  } });
}
function showGpuNote() {
  const n = document.createElement('div');
  n.style.cssText = 'position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:90;max-width:min(560px,92vw);background:#1b1820;color:#f1ecf5;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 40px 12px 16px;font:500 13px/1.45 Inter,system-ui,sans-serif;box-shadow:0 20px 40px -12px rgba(0,0,0,.7)';
  n.innerHTML = '<b style="color:#ff8a4c">Your browser is drawing 3D without the graphics card</b>, so this will be slow. Turn on hardware acceleration (Chrome: Settings → System → “Use graphics acceleration when available”), then restart the browser.<button aria-label="Close" style="position:absolute;right:10px;top:8px;background:none;border:0;color:#aaa;font-size:18px;cursor:pointer">×</button>';
  n.querySelector('button').onclick = () => n.remove();
  document.body.appendChild(n);
}

async function boot() {
  $('ldStep').textContent = 'Lighting the sky…';
  try { await loadSky(); } catch (e) { console.warn('HDRI sky unavailable, using fallback lighting', e); }
  const steps = [['Laying out the park', buildPark], ['Marking the pitch', buildPitch], ['Pouring the bowl', buildBowl],
    ['Bolting in the seats', buildSeats], ['Glazing the skyboxes', buildSkyboxes], ['Stretching the roof', buildRoof], ...(EVENT === 'concert' ? [['Building the stage', buildStage]] : [])];
  for (let i = 0; i < steps.length; i++) {
    $('ldStep').textContent = steps[i][0] + '…'; $('ldBar').style.width = (i / steps.length * 100) + '%';
    await nextFrame(); await nextFrame();
    steps[i][1]();
  }
  $('ldStep').textContent = fmt(NS) + ' seats ready'; $('ldBar').style.width = '100%';
  const p = poseIntro(); camPose.pos.copy(p.pos); camPose.target.copy(p.target); camPose.fov = p.fov;
  updateCamera(0); shC.set(0, 0, 0); applyShadow(shC, shHalf);
  blocks.forEach(B => B.overlay.visible = true);
  if (/[?&]cold\b/.test(location.search)) saltShaders();
  $('ldStep').textContent = 'Preparing shaders…';
  await warmShaders(p => { $('ldStep').textContent = `Preparing shaders… ${Math.round(p * 100)}%`; });
  blocks.forEach(B => B.overlay.visible = false);
  looping = true; requestAnimationFrame(frame);
  if (SOFTWARE_GL && !HQ && qForce === undefined) { qLevel = QL.length - 1; applyQuality(); showGpuNote(); }
  else if (!HQ && qForce === undefined && !document.hidden && qLevel === DEFAULT_Q) {
    $('ldStep').textContent = 'Tuning for your screen…';
    if (await measureFps(700) < 28) { qLevel = QL.length - 1; applyQuality(); }   // very slow GPU → extra-light level
  }
  /* (heavier levels via ?hq: measure → step down, hard 2.5 s limit) */
  if (!HQ && qForce === undefined && qLevel < DEFAULT_Q) {
    $('ldStep').textContent = 'Tuning for your screen…';
    const deadline = performance.now() + 2500;
    for (let pass = 0; pass < 5 && qLevel < DEFAULT_Q && performance.now() < deadline; pass++) {
      const fps = await measureFps(500);
      if (fps >= 57) break;
      let ms = 1000 / fps, steps = 0;
      while (qLevel < QL.length - 1 && (ms > 13 || steps === 0)) { const q0 = QL[qLevel], q1 = QL[qLevel + 1]; ms *= (q1.dpr / q0.dpr) ** 2 * (q0.ao && !q1.ao ? .72 : 1) * (q0.bloom && !q1.bloom ? .92 : 1); qLevel++; steps++; }
      applyQuality();
    }
  }
  fpsT = 0; fpsN = 0;
  $('loader').classList.add('gone'); document.body.classList.add('ready');
  await flyTo(poseOverview(), 3.6, { arc: 120 });
  setMode('overview');
  requestAnimationFrame(pick);
}
if (/[?&]debug\b/.test(location.search)) window.app = { S, blocks, boxes, chairs, findSeat, selectStand, selectBlock, selectSeat, upgrade, chooseVip, selectChair, setHover, goOverview, camera, renderer, flyTo, V3, boxLight, ZONES, selectFloor, selectZone, keepZone, upgradeZone, qLevel: () => qLevel };
$('brandTxt').textContent = EVENT === 'concert' ? 'Live in Concert · Stadium Tour' : 'Matchday · Final';
/* the loader must always clear, even if something above throws */
boot().catch(e => {
  console.error('boot failed', e);
  if (!looping) { looping = true; requestAnimationFrame(frame); }
  $('loader').classList.add('gone'); document.body.classList.add('ready');
  try { setMode('overview'); } catch (e2) {}
});
</script>
